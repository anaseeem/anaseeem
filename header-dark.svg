<svg viewBox="0 0 900 280" width="900" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ashfaq Naseem — Full-stack TypeScript developer, backend-leaning">
  <rect width="900" height="280" fill="#0D1117"/>

  <foreignObject x="56" y="34" width="780" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;">
      <div style="font-size:32px;font-weight:700;color:#E6EDF3;letter-spacing:-0.3px;">Ashfaq Naseem</div>
      <div style="margin-top:10px;font-size:15.5px;line-height:1.55;color:#8B949E;max-width:700px;">
        Full-stack TypeScript developer, backend-leaning — I build APIs, caching layers, and the automation that keeps them running.
      </div>
    </div>
  </foreignObject>

  <line x1="56" y1="172" x2="844" y2="172" stroke="#21262D" stroke-width="1"/>

  <style>
    .pulse { animation: flow 4s linear infinite; }
    @keyframes flow {
      0%   { transform: translateX(0); opacity: 0; }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { transform: translateX(780px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 0; }
    }
    .node-label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12.5px; }
    .caption { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-size: 12px; fill: #6E7681; }
  </style>

  <line x1="60" y1="218" x2="840" y2="218" stroke="#30363D" stroke-width="1.5"/>
  
    <rect x="60" y="200" width="124" height="36" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
    <text x="122" y="223" text-anchor="middle" class="node-label" fill="#C9D1D9">sources</text>
    <rect x="224" y="200" width="124" height="36" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
    <text x="286" y="223" text-anchor="middle" class="node-label" fill="#C9D1D9">scraper</text>
    <rect x="388" y="200" width="124" height="36" rx="6" fill="#0D1117" stroke="#2DD4BF" stroke-width="1.4"/>
    <text x="450" y="223" text-anchor="middle" class="node-label" fill="#2DD4BF">matcher</text>
    <rect x="552" y="200" width="124" height="36" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
    <text x="614" y="223" text-anchor="middle" class="node-label" fill="#C9D1D9">cache</text>
    <rect x="716" y="200" width="124" height="36" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
    <text x="778" y="223" text-anchor="middle" class="node-label" fill="#C9D1D9">api</text>
  <circle class="pulse" cx="60" cy="218" r="3.5" fill="#F0B429"/>
  <text x="60" y="258" class="caption">a request moving through the kind of system I build</text>
</svg>